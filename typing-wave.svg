<svg width="560" height="70" viewBox="0 0 560 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="revealText">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width"
                 values="0;46;152;213;304;380"
                 keyTimes="0;0.12;0.4;0.56;0.8;1"
                 calcMode="discrete"
                 dur="2.6s"
                 fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Typed sentence: appears word by word, not sliding -->
  <g clip-path="url(#revealText)">
    <text x="10" y="38"
          font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-weight="500"
          font-size="24"
          fill="#FFFFFF"
          text-anchor="start">
      Hi there, I'm Aaron Tito!
    </text>
  </g>

  <!-- Waving hand emoji, appears once typing finishes, then waves a few times -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.01s" fill="freeze"/>
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 375 40; 20 375 40; -15 375 40; 20 375 40; 0 375 40"
      dur="0.9s"
      begin="2.6s"
      repeatCount="3"
      fill="freeze"/>
    <text x="365" y="38" font-size="26">👋</text>
  </g>

  <!-- Animated ruler line, draws itself after the wave finishes -->
  <line x1="10" y1="50" x2="10" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" from="10" to="410" begin="5.3s" dur="0.8s" fill="freeze"/>
  </line>
</svg>
